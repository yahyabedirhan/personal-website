<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 702" width="760" height="702" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif"><rect width="760" height="702" fill="#111113"/><text x="32" y="48" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#ecebe8">The effort lifecycle</text><text x="32" y="72" font-size="13" fill="#8b8a86">One worktree, one branch: a thinking session decides, a fresh orchestrator builds.</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3a29e"/></marker></defs><text x="32" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8b8a86">START</text><rect x="150" y="104" width="578" height="76" rx="8" fill="#18181b" stroke="rgba(255,255,255,.12)"/><text x="168" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#ecebe8">init-effort</text><text x="168" y="158" font-size="12.5" fill="#a3a29e">worktree and branch, or a new repo</text><line x1="439.0" y1="180" x2="439.0" y2="206" stroke="#a3a29e" stroke-width="1.2" marker-end="url(#a)"/><text x="32" y="238" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8b8a86">THINKING</text><rect x="150" y="208" width="578" height="76" rx="8" fill="#18181b" stroke="rgba(255,255,255,.12)"/><text x="168" y="238" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#ecebe8">grilling · to-spec · to-tickets</text><text x="168" y="262" font-size="12.5" fill="#a3a29e">leaves a spec, tickets and a handoff</text><line x1="439.0" y1="284" x2="439.0" y2="310" stroke="#a3a29e" stroke-width="1.2" marker-end="url(#a)"/><text x="32" y="342" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8b8a86">HANDOVER</text><rect x="150" y="312" width="578" height="76" rx="8" fill="#18181b" stroke="rgba(255,255,255,.12)"/><text x="168" y="342" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#ecebe8">handover · handoff</text><text x="168" y="366" font-size="12.5" fill="#a3a29e">starts a fresh orchestrator from the handoff</text><line x1="439.0" y1="388" x2="439.0" y2="414" stroke="#a3a29e" stroke-width="1.2" marker-end="url(#a)"/><text x="32" y="446" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8b8a86">BUILD</text><rect x="150" y="416" width="578" height="112" rx="8" fill="#18181b" stroke="rgba(255,255,255,.12)"/><text x="168" y="446" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#ecebe8">orchestrate-with-handoff → orchestrate-effort</text><text x="168" y="470" font-size="12.5" fill="#a3a29e">orchestrating: delegate, be the one contact</text><text x="168" y="488" font-size="12.5" fill="#a3a29e">implement: each ticket by a sub-agent</text><text x="168" y="506" font-size="12.5" fill="#a3a29e">show-me, then to-pr opens the pull request</text><line x1="439.0" y1="528" x2="439.0" y2="542" stroke="#a3a29e" stroke-width="1.2"/><rect x="329.0" y="542" width="220" height="30" rx="15" fill="rgba(168,149,255,.12)" stroke="#a895ff"/><text x="439.0" y="561" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a895ff">you approve the pull request</text><line x1="439.0" y1="572" x2="439.0" y2="592" stroke="#a3a29e" stroke-width="1.2" marker-end="url(#a)"/><text x="32" y="624" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#8b8a86">SETTLE</text><rect x="150" y="594" width="578" height="76" rx="8" fill="#18181b" stroke="rgba(255,255,255,.12)"/><text x="168" y="624" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#ecebe8">settle-effort → settle-session</text><text x="168" y="648" font-size="12.5" fill="#a3a29e">merge, follow up, carry over, free what merged</text></svg>